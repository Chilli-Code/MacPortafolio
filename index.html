<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>macportafolio</title>
    <meta name="description" content="Sistema de proyectos para freelancers">
    <link rel="preload" href="/fonts/roboto-mono/RobotoMono-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/georama/Georama-VariableFont_wdth,wght.woff2" as="font" type="font/woff2" crossorigin>

    <script>
      (function() {
        // ⭐ APLICAR TEMA
        const theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        // ⭐ APLICAR WALLPAPER
        const defaultWallpaper = '/images/wallpapers/wallpaper.webp';
        const wallpaper = localStorage.getItem('wallpaper') || defaultWallpaper;
        // Guardar wallpaper por defecto si no existe
        if (!localStorage.getItem('wallpaper')) {
          localStorage.setItem('wallpaper', defaultWallpaper);
        }
        // Aplicar wallpaper inmediatamente
        document.documentElement.style.setProperty('--wallpaper-url', `url(${wallpaper})`);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
